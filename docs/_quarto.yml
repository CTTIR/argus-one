project:
  type: website
  output-dir: _site

website:
  favicon: images/icon-symbol.svg
  title: "Argus One"
  description: "DOI-based duplicate merger for Zotero"
  site-url: "https://cttir.github.io/argus-one/"
  repo-url: "https://github.com/CTTIR/argus-one"
  repo-actions: [edit, issue]
  navbar:
    logo: images/icon.svg
    logo-alt: "argus-one hex logo"
    background: primary
    left:
      - text: "Home"
        href: index.qmd
      - text: "Releases"
        href: "https://github.com/CTTIR/argus-one/releases"
      - text: "Issues"
        href: "https://github.com/CTTIR/argus-one/issues"
    right:
      - icon: github
        href: "https://github.com/CTTIR/argus-one"
        aria-label: GitHub
  page-footer:
    left: "© 2026 Raban Heller · MIT License"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      dark: darkly
      light: flatly
    css: branding.css
    toc: true
    toc-depth: 3
    code-copy: true
    smooth-scroll: true
